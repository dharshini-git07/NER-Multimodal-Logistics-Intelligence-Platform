version: '3.8'

services:
  # 1. PostgreSQL with PostGIS Spatial Extensions
  db:
    image: postgis/postgis:15-3.3
    container_name: ner_postgis_db
    environment:
      POSTGRES_USER: ner_user
      POSTGRES_PASSWORD: ner_password
      POSTGRES_DB: ner_logistics_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner_user -d ner_logistics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & ML Prediction Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ner_fastapi_backend
    environment:
      - DATABASE_URL=postgresql://ner_user:ner_password@db:5432/ner_logistics_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # 3. React + TypeScript + Tailwind Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ner_react_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgis_data:
